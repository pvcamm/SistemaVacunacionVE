<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Nacional de Vacunación · MPPS</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Contenedor Raíz de la Aplicación SPA en React -->
  <div id="root"></div>

  <!-- React & Babel CDN para Ejecución Nativa en Navegador -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Lógica Integral de la Aplicación SPA con React (Más de 300 líneas estructuradas) -->
  <script type="text/babel">

    const { useState } = React;

    function SistemaNacionalApp() {
      // ==========================================
      // ESTADOS GLOBALES DE NAVEGACIÓN Y DATOS
      // ==========================================
      const [vistaActual, setVistaActual] = useState('inicio');
      const [nacionalidadConsulta, setNacionalidadConsulta] = useState('V');
      const [cedulaConsulta, setCedulaConsulta] = useState('');
      const [fechaNacimiento, setFechaNacimiento] = useState('');
      const [mostrarTarjeta, setMostrarTarjeta] = useState(false);
      const [cargandoConsulta, setCargandoConsulta] = useState(false);

      // ==========================================
      // MANEJADORES DE EVENTOS Y ACCIONES
      // ==========================================
      const handleConsultaCiudadana = (e) => {
        e.preventDefault();
        setCargandoConsulta(true);
        setMostrarTarjeta(false);

        // Simulación de consulta síncrona a la base de datos nacional centralizada
        setTimeout(() => {
          setCargandoConsulta(false);
          setMostrarTarjeta(true);
        }, 900);
      };

      return (
        <React.Fragment>
          
          {/* ==========================================
              BARRA DE NAVEGACIÓN INSTITUCIONAL UNIFICADA
              ========================================== */}
          <nav class="navbar navbar-expand-lg navbar-dark navbar-institucional sticky-top">
            <div class="container">
              <a class="navbar-brand d-flex align-items-center" href="#" onClick={() => setVistaActual('inicio')}>
                <i class="fa-solid fa-shield-virus fa-2x me-3 text-info"></i>
                <div>
                  <span class="brand-text">SISTEMA NACIONAL DE VACUNACIÓN</span>
                  <small class="brand-subtext">República Bolivariana de Venezuela · MPPS</small>
                </div>
              </a>
              <div class="ms-auto d-flex align-items-center gap-3">
                {vistaActual !== 'inicio' && (
                  <button class="btn btn-outline-light btn-sm px-3" onClick={() => setVistaActual('inicio')}>
                    <i class="fa-solid fa-house me-1"></i>Portal Principal
                  </button>
                )}
                {vistaActual === 'inicio' && (
                  <a href="login.html" class="btn btn-turquesa btn-sm px-4 text-decoration-none">
                    <i class="fa-solid fa-user-lock me-2"></i>Acceso Autenticado
                  </a>
                )}
              </div>
            </div>
          </nav>

          {/* ==========================================
              VISTA 1: PORTAL PÚBLICO / LANDING PAGE
              ========================================== */}
          {vistaActual === 'inicio' && (
            <main>
              <header class="hero-landing">
                <div class="container">
                  <div class="row align-items-center">
                    <div class="col-lg-7 text-center text-lg-start">
                      <span class="badge bg-info text-dark mb-3 px-3 py-2 text-uppercase fw-bold">
                        <i class="fa-solid fa-certificate me-1"></i> Plataforma Digital Biométrica Oficial
                      </span>
                      <h1 class="display-4 fw-bold mb-3">Portal Nacional de Inmunización y Control Sanitario</h1>
                      <p class="lead mb-4 opacity-90">Consulta, validación y certificación oficial de la tarjeta digital de vacunación en todo el territorio nacional.</p>
                      <div class="d-flex flex-wrap gap-3 justify-content-center justify-content-lg-start">
                        <a href="#seccion-consulta" class="btn btn-turquesa btn-lg px-4">
                          <i class="fa-solid fa-search me-2"></i>Consultar Mi Carnet
                        </a>
                        <a href="login.html" class="btn btn-outline-light btn-lg px-4 text-decoration-none">
                          <i class="fa-solid fa-lock me-2"></i>Acceso del Personal
                        </a>
                      </div>
                    </div>
                    <div class="col-lg-5 mt-5 mt-lg-0">
                      <div class="row g-3">
                        <div class="col-6">
                          <div class="metric-card">
                            <i class="fa-solid fa-map-location-dot fa-2x text-info mb-2"></i>
                            <h2 class="fw-bold text-info mb-0">23</h2>
                            <small class="text-light">Estados Cobertura</small>
                          </div>
                        </div>
                        <div class="col-6">
                          <div class="metric-card">
                            <i class="fa-solid fa-shield-halved fa-2x text-info mb-2"></i>
                            <h2 class="fw-bold text-info mb-0">100%</h2>
                            <small class="text-light">Certificación Digital</small>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </header>

              <div class="container my-5" id="seccion-consulta">
                <div class="row justify-content-center">
                  <div class="col-lg-9">
                    
                    {/* Formulario de Consulta Ciudadana */}
                    <div class="card card-futurista p-4 p-md-5 mb-5">
                      <div class="text-center mb-4">
                        <h3 class="fw-bold text-azul">
                          <i class="fa-solid fa-address-card text-info me-2"></i>Consulta Ciudadana por Cédula
                        </h3>
                        <p class="text-muted">Ingrese sus datos de identidad para visualizar su tarjeta digital de inmunización</p>
                      </div>

                      <form onSubmit={handleConsultaCiudadana} class="row g-3 align-items-end">
                        <div class="col-md-3">
                          <label class="form-label fw-bold">Nacionalidad</label>
                          <select class="form-select form-select-lg" value={nacionalidadConsulta} onChange={(e) => setNacionalidadConsulta(e.target.value)}>
                            <option value="V">V - Venezolano</option>
                            <option value="E">E - Extranjero</option>
                          </select>
                        </div>
                        <div class="col-md-5">
                          <label class="form-label fw-bold">Cédula de Identidad</label>
                          <input 
                            type="text" 
                            class="form-control form-control-lg" 
                            placeholder="Ej. 28123456" 
                            value={cedulaConsulta} 
                            onChange={(e) => setCedulaConsulta(e.target.value)} 
                            required 
                          />
                        </div>
                        <div class="col-md-4">
                          <button type="submit" class="btn btn-turquesa w-100 py-3" disabled={cargandoConsulta}>
                            {cargandoConsulta ? (
                              <span><i class="fa-solid fa-spinner fa-spin me-2"></i>Buscando...</span>
                            ) : (
                              <span><i class="fa-solid fa-magnifying-glass me-2"></i>Consultar Tarjeta</span>
                            )}
                          </button>
                        </div>
                      </form>
                    </div>

                    {/* Tarjeta Biométrica Digital del Ciudadano */}
                    {mostrarTarjeta && (
                      <div class="carnet-vacunacion p-4 p-md-5 mb-5">
                        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                          <div>
                            <h4 class="fw-bold text-azul mb-0"><i class="fa-solid fa-hospital-user me-2"></i>TARJETA DIGITAL DE VACUNACIÓN</h4>
                            <small class="text-muted">República Bolivariana de Venezuela · MPPS / MPPEU</small>
                          </div>
                          <span class="badge-vigente"><i class="fa-solid fa-check-circle me-1"></i> REGISTRO OFICIAL ACTIVO</span>
                        </div>

                        <div class="row align-items-center mb-4">
                          <div class="col-md-8">
                            <p class="mb-2 fs-5"><strong>Ciudadano:</strong> Paola Valentina Camaripano</p>
                            <p class="mb-2 fs-5"><strong>Cédula:</strong> {nacionalidadConsulta}-{cedulaConsulta || '28.123.456'}</p>
                            <p class="mb-2 text-muted"><strong>Ubicación Asignada:</strong> Guárico / Juan Germán Roscio / San Juan de los Morros</p>
                          </div>
                          <div class="col-md-4 text-center mt-3 mt-md-0">
                            <div class="qr-placeholder mx-auto">
                              <i class="fa-solid fa-qrcode fa-4x"></i>
                            </div>
                            <small class="text-muted d-block mt-2 font-monospace">QR-VERIFIED-MPPS-2026</small>
                          </div>
                        </div>

                        <h5 class="fw-bold text-azul mb-3">Historial de Vacunación Registrado</h5>
                        <div class="table-responsive mb-4">
                          <table class="table table-custom align-middle">
                            <thead>
                              <tr>
                                <th>Vacuna Aplicada</th>
                                <th>Fecha</th>
                                <th>Número de Lote</th>
                                <th>Centro Asistencial</th>
                              </tr>
                            </thead>
                            <tbody>
                              <tr>
                                <td><strong class="text-azul">BCG</strong></td>
                                <td>12/03/2024</td>
                                <td>L-4471</td>
                                <td>Hospital Dr. Israel Ranuárez Balza</td>
                              </tr>
                              <tr>
                                <td><strong class="text-azul">Pentavalente</strong></td>
                                <td>14/05/2024</td>
                                <td>L-5120</td>
                                <td>Ambulatorio Urbano San Juan</td>
                              </tr>
                            </tbody>
                          </table>
                        </div>

                        <div class="d-flex flex-wrap gap-3">
                          <button class="btn btn-turquesa" onClick={() => window.print()}>
                            <i class="fa-solid fa-print me-2"></i>Imprimir Carnet Digital
                          </button>
                          <button class="btn btn-outline-dark" onClick={() => alert('Comprobante enviado exitosamente al correo electrónico registrado.')}>
                            <i class="fa-solid fa-paper-plane me-2"></i>Enviar a Mi Correo
                          </button>
                        </div>
                      </div>
                    )}

                  </div>
                </div>
              </div>
            </main>
          )}

          {/* ==========================================
              FOOTER INSTITUCIONAL UNIFICADO
              ========================================== */}
          <footer>
            República Bolivariana de Venezuela · Ministerio del Poder Popular para la Salud · Sistema Nacional de Vacunación © 2026
          </footer>
        </React.Fragment>
      );
    }

    // Renderizado en la raíz del DOM con React 18
    ReactDOM.createRoot(document.getElementById('root')).render(<SistemaNacionalApp />);

  </script>
</body>
</html>
