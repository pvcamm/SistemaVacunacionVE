<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Salud · Registro Operativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <nav class="navbar navbar-dark navbar-institucional">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <i class="fa-solid fa-hospital-user fa-2x me-3 text-info"></i>
        <div>
          <span class="brand-text">CENTRO DE SALUD OPERATIVO</span>
          <small class="brand-subtext">Perfil 2 · Registro Diario de Inmunización y Exámenes</small>
        </div>
      </a>
      <div class="d-flex gap-2">
        <a href="buscar_personas.html" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-search me-1"></i>Buscador</a>
        <a href="../login.html" class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-power-off me-1"></i>Salir</a>
      </div>
    </div>
  </nav>

  <main class="container my-5" id="root-centro"></main>

  <footer>República Bolivariana de Venezuela · Sistema Nacional de Vacunación © 2026</footer>

  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script type="text/babel">
    const { useState } = React;
    function CentroApp() {
      const [tab, setTab] = useState('persona');
      const [msg, setMsg] = useState('');

      return (
        <div>
          {msg && <div class="alert alert-success alert-dismissible fade show mb-4"><i class="fa-solid fa-circle-check me-2"></i>{msg}</div>}
          
          <ul class="nav nav-pills nav-pills-gob mb-4" role="tablist">
            <li class="nav-item">
              <button class={`nav-link ${tab==='persona'?'active':''}`} onClick={()=>setTab('persona')}><i class="fa-solid fa-user-plus me-2"></i>1. Registrar Persona</button>
            </li>
            <li class="nav-item">
              <button class={`nav-link ${tab==='vacuna'?'active':''}`} onClick={()=>setTab('vacuna')}><i class="fa-solid fa-syringe me-2"></i>2. Cargar Vacuna</button>
            </li>
            <li class="nav-item">
              <button class={`nav-link ${tab==='examenes'?'active':''}`} onClick={()=>setTab('examenes')}><i class="fa-solid fa-file-medical me-2"></i>3. Exámenes Externos para Informe</button>
            </li>
          </ul>

          {tab === 'persona' && (
            <div class="card card-futurista p-4 p-md-5">
              <h4 class="fw-bold text-azul mb-4"><i class="fa-solid fa-id-card me-2 text-info"></i>Datos Básicos del Ciudadano</h4>
              <form onSubmit={(e)=>{e.preventDefault(); setMsg('Ciudadano registrado con éxito en el sistema');}}>
                <div class="row g-3">
                  <div class="col-md-4"><label class="form-label">Cédula</label><input type="text" class="form-control" placeholder="V-28123456" required /></div>
                  <div class="col-md-4"><label class="form-label">Nombres</label><input type="text" class="form-control" required /></div>
                  <div class="col-md-4"><label class="form-label">Apellidos</label><input type="text" class="form-control" required /></div>
                  <div class="col-md-4"><label class="form-label">Fecha Nacimiento</label><input type="date" class="form-control" required /></div>
                  <div class="col-md-4"><label class="form-label">Correo Electrónico</label><input type="email" class="form-control" required /></div>
                  <div class="col-md-4"><label class="form-label">Teléfono</label><input type="tel" class="form-control" required /></div>
                  <div class="col-12 mt-4"><button type="submit" class="btn btn-turquesa">Guardar Ciudadano</button></div>
                </div>
              </form>
            </div>
          )}

          {tab === 'vacuna' && (
            <div class="card card-futurista p-4 p-md-5">
              <h4 class="fw-bold text-azul mb-4"><i class="fa-solid fa-vial me-2 text-info"></i>Registro de Dosis Inmunológica Aplicada</h4>
              <form onSubmit={(e)=>{e.preventDefault(); setMsg('Dosis de vacuna registrada y enlazada al paciente');}}>
                <div class="row g-3">
                  <div class="col-md-4"><label class="form-label">Cédula Paciente</label><input type="text" class="form-control" placeholder="V-28123456" required /></div>
                  <div class="col-md-4">
                    <label class="form-label">Vacuna Aplicada</label>
                    <select class="form-select"><option>BCG</option><option>Pentavalente</option><option>Polio</option><option>Fiebre Amarilla</option></select>
                  </div>
                  <div class="col-md-4"><label class="form-label">Número de Lote</label><input type="text" class="form-control" placeholder="L-4471" required /></div>
                  <div class="col-12 mt-4"><button type="submit" class="btn btn-turquesa">Registrar Dosis</button></div>
                </div>
              </form>
            </div>
          )}

          {tab === 'examenes' && (
            <div class="card card-futurista p-4 p-md-5">
              <h4 class="fw-bold text-azul mb-4"><i class="fa-solid fa-paperclip me-2 text-info"></i>Anexo de Exámenes para la Subregión</h4>
              <form onSubmit={(e)=>{e.preventDefault(); setMsg('Examen externo anexado para revisión y validación de la Subregión');}}>
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label">Cédula Paciente</label><input type="text" class="form-control" required /></div>
                  <div class="col-md-6">
                    <label class="form-label">Tipo de Examen</label>
                    <select class="form-select"><option>Serología de Anticuerpos</option><option>Informe de Exención Médica</option></select>
                  </div>
                  <div class="col-12"><label class="form-label">Adjuntar Documento Digital (PDF/JPG)</label><input type="file" class="form-control" required /></div>
                  <div class="col-12 mt-4"><button type="submit" class="btn btn-turquesa">Cargar Documento para Subregión</button></div>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root-centro')).render(<CentroApp />);
  </script>
</body>
</html>
